name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Run tests
        run: |
          docker run --rm \
            --volume "${PWD}:/package" \
            --workdir /package \
            swift:6.0 \
            ./scripts/coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-linux
          path: coverage
          if-no-files-found: error

  macos:
    name: macOS
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Run tests
        run: ./scripts/coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-macos
          path: coverage
          if-no-files-found: error
